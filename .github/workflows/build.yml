name: Build PhotoRecovery Pro APK
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces a build that is still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Find the project (newest ZIP, or unpacked sources)
        run: |
          zip=$(ls PhotoRecovery_Pro_*.zip 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$zip" ]; then
            echo "Building $zip"
            rm -rf build_src && unzip -q "$zip" -d build_src
            echo "PROJECT=build_src/PhotoRecovery" >> "$GITHUB_ENV"
          else
            echo "PROJECT=." >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets, using a temporary debug key"
          fi
      - name: Unit tests
        working-directory: ${{ env.PROJECT }}
        run: gradle test --stacktrace
      - name: Build APKs
        working-directory: ${{ env.PROJECT }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      # The test report is kept even when a test fails, so the failure can be read.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ env.PROJECT }}/app/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoRecovery-Pro-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
