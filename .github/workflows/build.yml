name: Build PhotoRecovery Pro APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find and unzip the project
        run: |
          echo "Files in repository:"
          find . -path ./.git -prune -o -type f -print
          zip=$(find . -iname '*photo*recovery*.zip' -printf '%f\t%p\n' | sort -V | tail -n 1 | cut -f2)
          if [ -z "$zip" ]; then
            echo "::error::No PhotoRecovery ZIP file in the repository. Upload it first."
            exit 1
          fi
          echo "Building $zip"
          unzip -q "$zip" -d "$RUNNER_TEMP/src"
          settings=$(find "$RUNNER_TEMP/src" -name settings.gradle.kts | head -n 1)
          if [ -z "$settings" ]; then
            echo "::error::The ZIP has no settings.gradle.kts"
            exit 1
          fi
          echo "PROJECT=$(dirname "$settings")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets, using a temporary debug key"
          fi
      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p "$PROJECT" test assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoRecovery-Pro-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
