name: Build PhotoRecovery Pro APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PhotoRecovery_Pro_1.7_Source.zip
      - run: printf '\nandroid.useAndroidX=true\n' >> PhotoRecovery/gradle.properties
      - name: Add missing launcher color
        run: echo '<resources><color name="ic_launcher_background">#0D263D</color></resources>' > PhotoRecovery/app/src/main/res/values/ic_launcher_background.xml
      - name: Add missing import
        run: sed -i '/^import android.content.Context/a import android.graphics.BitmapFactory' PhotoRecovery/app/src/main/java/com/mustafa/photorecovery/Restorer.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle testDebugUnitTest assembleDebug --stacktrace
        working-directory: PhotoRecovery
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoRecovery-Pro-1.7-APK
          path: PhotoRecovery/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
